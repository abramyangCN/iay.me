name: Build & Deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [resume-updated]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build
        env:
          # Points to the raw resume.json in the Resume repo
          RESUME_JSON_URL: ${{ secrets.RESUME_JSON_URL }}

      - name: Deploy to NAS via rsync
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST:    ${{ secrets.DEPLOY_SSH_HOST }}
          USER:    ${{ secrets.DEPLOY_SSH_USER }}
          PATH:    ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" \
            out/ \
            "$USER@$HOST:$PATH"
          echo "✓ Deployed to $HOST"
